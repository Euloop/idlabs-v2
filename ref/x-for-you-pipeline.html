<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For You Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}#ver,.sr{display:none}
/* Layout: a single wide drawing; tabs and version picker above, two quiet controls below. Light only: hairlines, plus-marks, one green signal. */
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#8B8B86; --ghost:#D4D4D0; --guide:#A4A49F; --hi:#EFEFEB; --line:#ECECE8; --acc:#1FD655; --acct:#0FA93E; --thu:#2F6BFF; --phx:#F2711C;
  --sans:'Geist',ui-sans-serif,system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink)}
.mark i{font-style:normal;color:var(--acct);margin-left:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
select#ver{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:500 11px/1 var(--mono);letter-spacing:.04em;padding:8px 30px 8px 12px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4px 4px;background-repeat:no-repeat}
select#ver:hover{border-color:var(--ink)}
nav{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--line)}
nav button{appearance:none;background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:10px 0;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:hover{color:var(--ink)}
button:focus-visible,select:focus-visible{outline:1.5px solid var(--acct);outline-offset:3px}
.stage{overflow-x:auto}
svg#stage{display:block;width:100%;min-width:760px;height:auto}
.ctrl{display:flex;justify-content:flex-end;gap:18px}
.ctrl button{appearance:none;border:0;background:none;color:var(--muted);font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 0;cursor:pointer}
.ctrl button:hover{color:var(--ink)}
/* v2 drawing */
.pl{fill:none;stroke:var(--ink);stroke-opacity:.2;stroke-width:.8;stroke-linejoin:round}
.pl.on{stroke-opacity:.75}
.x{fill:none;stroke:var(--ink);stroke-width:1.1}
.xg{fill:none;stroke:var(--ghost);stroke-width:1}
.e{fill:none;stroke:var(--ink);stroke-opacity:.075;stroke-width:.5}
.e2{fill:none;stroke:var(--ink);stroke-opacity:.3;stroke-width:.6}
.tr{fill:none;stroke:var(--ink);stroke-opacity:.6;stroke-width:.9}
.fn{fill:none;stroke:var(--ink);stroke-opacity:.18;stroke-width:.8;stroke-dasharray:2 4}
.fns{fill:none;stroke:var(--ink);stroke-opacity:.38;stroke-width:.8}
.dt{fill:var(--ghost)}.gd{fill:var(--acc)}.pu{fill:var(--ink);fill-opacity:.5}.tg{fill:var(--ink)}
.cp{font:500 9.5px var(--mono);letter-spacing:.14em;fill:var(--muted)}.cp.on{fill:var(--ink)}
.rt{font:500 12px var(--mono);letter-spacing:.04em;fill:var(--ink)}.rg{fill:var(--acct)}
.rk{font:400 10.5px var(--mono);fill:var(--muted)}.rv{font:400 10.5px var(--mono);fill:var(--ink)}
/* v5 source colours */
.tb{fill:var(--thu)}.ob{fill:var(--phx)}
.xt{fill:none;stroke:var(--thu);stroke-width:1.2}.xo{fill:none;stroke:var(--phx);stroke-width:1.2}
.xtl{fill:none;stroke:var(--thu);stroke-opacity:.35;stroke-width:.8}
.et{fill:none;stroke:var(--thu);stroke-opacity:.16;stroke-width:.6}.eo{fill:none;stroke:var(--phx);stroke-opacity:.16;stroke-width:.6}
.at{fill:none;stroke:var(--thu);stroke-opacity:.45;stroke-width:.8}.ao{fill:none;stroke:var(--phx);stroke-opacity:.45;stroke-width:.8}
.cpl{fill:none;stroke:var(--thu);stroke-width:.9}.capf{fill:var(--thu);fill-opacity:.07;stroke:none}
.rvt{font:500 10.5px var(--mono);fill:var(--thu)}.rvo{font:500 10.5px var(--mono);fill:var(--phx)}
.cpl2{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:.8;stroke-dasharray:3 3}.xs{fill:none;stroke:var(--ink);stroke-width:.9}
.e3{fill:none;stroke:var(--ink);stroke-opacity:.13;stroke-width:.6}
.trk{fill:none;stroke:var(--ink);stroke-opacity:.42;stroke-width:.7}
.trk2{fill:none;stroke:var(--ink);stroke-opacity:.16;stroke-width:.6}
.oc{fill:var(--bg);stroke:var(--ink);stroke-width:1}.oc2{fill:none;stroke:var(--ink);stroke-opacity:.22;stroke-width:.8}
.hk{font:400 11px var(--mono);fill:var(--ink)}.hv{font:500 11px var(--mono);fill:var(--ink)}
.sg{font:400 16px var(--sans);fill:var(--ink)}.sv{font:500 11.5px var(--mono);fill:var(--ink)}
.e4{fill:none;stroke:var(--ink);stroke-opacity:.05;stroke-width:.5}
.gt{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:.9;stroke-dasharray:5 5}
.sg2{font:400 13px var(--sans);fill:var(--ink)}.sv2{font:500 10.5px var(--mono);fill:var(--ink)}
body.scrolly nav,body.scrolly .ctrl{display:none}
body.scrolly .stage{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100svh;display:flex;align-items:center}
.mini text{display:none}
#gl{position:relative;flex:1;align-self:stretch;width:100%;height:100%;overflow:hidden}
#gl canvas{display:block;width:100%;height:100%}
#gl .ov{position:absolute;inset:0;pointer-events:none}
#gl .lab{position:absolute;left:0;top:0;font:500 10px var(--mono);letter-spacing:.14em;color:var(--muted);white-space:nowrap;opacity:0;will-change:transform}
#gl .lab.big{font:400 18px var(--sans);color:var(--ink);letter-spacing:0}
#gl .lab.val{color:var(--ink);letter-spacing:.04em}
#gl .hud{left:max(16px,env(safe-area-inset-left,0px));top:22px;opacity:1;color:var(--ink);transform:none}
#gl .pd{left:auto;right:max(18px,env(safe-area-inset-right,0px));width:5px;height:5px;border-radius:50%;background:var(--ghost);opacity:1;transform:none}
#gl .pd.on{background:var(--ink)}
.fw{fill:var(--bg);stroke:none}
svg.cam path,svg.cam ellipse,svg.cam rect,svg.cam circle{vector-effect:non-scaling-stroke}
.scn text{opacity:var(--to,1)}
svg#stage{transform-origin:50% 50%}
.fin{fill:#F3F3F0;stroke:none}
.fwx{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.gin{fill:none;stroke:url(#gIn);stroke-width:1}.gout{fill:none;stroke:url(#gOut);stroke-width:1}
.mouth{fill:url(#gM);stroke:var(--ink);stroke-width:1}.endo{fill:url(#gE);stroke:var(--ink);stroke-width:1}
/* v1 drawing */
.o{fill:var(--bg);stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round}
.t{fill:var(--bg);stroke:var(--ink);stroke-width:.8;stroke-linejoin:round}
.n{fill:none;stroke:var(--ink);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.g{fill:none;stroke:var(--ghost);stroke-width:.8}
.gf{fill:var(--bg);stroke:var(--ghost);stroke-width:.8;stroke-linejoin:round}
.d{fill:none;stroke:var(--guide);stroke-width:.8;stroke-dasharray:3 4}
.hl{fill:var(--hi);stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round}
.fl{fill:var(--hi);stroke:var(--ink);stroke-width:.7}
.af{fill:var(--acc);stroke:var(--ink);stroke-width:.8;stroke-linejoin:round}
.dot{fill:var(--ink)}.acc{fill:var(--acc)}
.lbl{font:600 12px var(--mono);fill:var(--ink)}
.sub{font:400 10.5px var(--mono);fill:var(--muted)}
.cap{font:500 9.5px var(--mono);letter-spacing:.1em;fill:var(--muted)}
.cap.on,tspan.on{fill:var(--ink)}
.stg{opacity:.3}.stg.on{opacity:1}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="mark">X / FOR YOU<i>+</i></div>
    <label class="sr" for="ver">Version</label>
    <select id="ver"></select>
  </div>
  <nav role="tablist" aria-label="Diagram views" id="tabs">
    <button role="tab" data-v="system">System</button>
    <button role="tab" data-v="sourcing">Sourcing</button>
    <button role="tab" data-v="prep">Hydrate + filter</button>
    <button role="tab" data-v="ranking">Scoring</button>
    <button role="tab" data-v="selection">Selection</button>
    <button role="tab" data-v="funnel">Funnel</button>
  </nav>
  <div class="stage">
    <div id="gl" hidden></div>
    <svg id="stage" viewBox="0 0 1200 560" role="img" aria-label="Animated diagram of the X For You pipeline"><g id="st"></g><g id="dy"></g></svg>
  </div>
  <div id="spacer" hidden style="height:1000vh"></div>
  <div class="ctrl">
    <button id="play" type="button" aria-pressed="false">Pause</button>
    <button id="restart" type="button">Restart</button>
  </div>
</div>

<script>
(function(){
const svg=document.getElementById('stage');
/* ================= v1 · isometric objects ================= */
let OUT=[];
const R1=n=>Math.round(n*10)/10;
const clamp=(v,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,u)=>a+(b-a)*u;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function iso(ox,oy,s){
  const P=(x,y,z)=>[ox+(x-y)*0.866*s,oy+((x+y)*0.5-z)*s];
  const pt=q=>{const p=P(q[0],q[1],q[2]);return R1(p[0])+' '+R1(p[1]);};
  const poly=(a,c)=>OUT.push('<path class="'+c+'" d="M'+a.map(pt).join('L')+'Z"/>');
  const line=(a,c)=>OUT.push('<path class="'+c+'" d="M'+a.map(pt).join('L')+'"/>');
  const box=(x,y,z,w,d,h,c,tc)=>{c=c||'o';
    poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c);
    poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c);
    poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],tc||c);};
  const wire=(x,y,z,w,d,h,c)=>{c=c||'d';const k=[[x,y],[x+w,y],[x+w,y+d],[x,y+d],[x,y]];
    line(k.map(q=>[q[0],q[1],z]),c);line(k.map(q=>[q[0],q[1],z+h]),c);
    for(let i=0;i<4;i++)line([[k[i][0],k[i][1],z],[k[i][0],k[i][1],z+h]],c);};
  const ring=(f,c)=>{const a=[];for(let i=0;i<=48;i++)a.push(f(i/48*Math.PI*2));line(a,c);};
  return {P:P,poly:poly,line:line,box:box,wire:wire,ring:ring};
}
const SL=(pts,c)=>OUT.push('<path class="'+c+'" d="M'+pts.map(p=>R1(p[0])+' '+R1(p[1])).join('L')+'"/>');
const TX=(x,y,s,c,a)=>OUT.push('<text class="'+c+'" x="'+R1(x)+'" y="'+R1(y)+'" text-anchor="'+(a||'middle')+'">'+esc(s)+'</text>');
const CI=(x,y,r,c)=>OUT.push('<circle class="'+c+'" cx="'+R1(x)+'" cy="'+R1(y)+'" r="'+R1(r)+'"/>');
const G=(c)=>OUT.push(c===null?'</g>':'<g class="'+c+'">');
function along(pts,u){let L=0;const d=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(l);L+=l;}
  let r=clamp(u)*L;for(let i=0;i<d.length;i++){if(r<=d[i]||i===d.length-1){const v=d[i]?clamp(r/d[i]):0;return [lerp(pts[i][0],pts[i+1][0],v),lerp(pts[i][1],pts[i+1][1],v)];}r-=d[i];}}
function cube(x,y,s,c,tc){iso(x,y+6*s,s).box(-6,-6,0,12,12,12,c||'t',tc);}

/* stage objects, drawn around a ground-centre point */
const OB={
  thunder(x,y,s){const p=iso(x,y,s);p.box(-32,-32,0,64,64,26);p.line([[-10.7,-32,26],[-10.7,32,26]],'n');p.line([[10.7,-32,26],[10.7,32,26]],'n');},
  phoenix(x,y,s,t){const p=iso(x,y,s),cz=34,r=30,a=t*.45;
    p.poly([[-24,-24,0],[24,-24,0],[24,24,0],[-24,24,0]],'g');
    const c=p.P(0,0,cz);CI(c[0],c[1],r*s*1.2247,'o');
    p.ring(u=>[r*Math.cos(u),r*Math.sin(u),cz],'g');
    p.ring(u=>[r*Math.cos(u)*Math.cos(a+1.571),r*Math.cos(u)*Math.sin(a+1.571),cz+r*Math.sin(u)],'g');
    p.ring(u=>[r*Math.cos(u)*Math.cos(a),r*Math.cos(u)*Math.sin(a),cz+r*Math.sin(u)],'n');
    for(let i=0;i<16;i++){const lat=(((i*0.618)%1)-.5)*2.4,lon=i*2.39+a;
      const X=r*Math.cos(lat)*Math.cos(lon),Y=r*Math.cos(lat)*Math.sin(lon),Z=r*Math.sin(lat);
      if(X+Y+Z>0){const q=p.P(X,Y,cz+Z);OUT.push('<rect class="dot" x="'+R1(q[0]-1.4)+'" y="'+R1(q[1]-1.4)+'" width="2.8" height="2.8"/>');}}},
  hydration(x,y,s,t){const p=iso(x,y,s);p.box(-32,-32,0,64,64,16);const z=34+3*Math.sin(t*2.2);
    [[-26,-26],[26,-26],[-26,26],[26,26]].forEach(q=>p.line([[q[0],q[1],16],[q[0],q[1],z]],'d'));p.box(-26,-26,z,52,52,3,'t');},
  filtering(x,y,s){const p=iso(x,y,s);[[-28,-28],[28,-28],[-28,28],[28,28]].forEach(q=>p.line([[q[0],q[1],0],[q[0],q[1],22]],'n'));
    p.box(-32,-32,22,64,64,4);for(let i=0;i<4;i++)for(let j=0;j<4;j++){const a=-26+i*14,b=-26+j*14;p.poly([[a,b,26],[a+8,b,26],[a+8,b+8,26],[a,b+8,26]],'g');}},
  scorer(x,y,s,act){const p=iso(x,y,s);for(let k=0;k<4;k++)p.box(-30,-30,k*14,60,60,5,'o',k===act?'hl':'o');},
  weighted(x,y,s){const p=iso(x,y,s);p.box(-32,-32,0,64,64,4);[34,14,22,28].forEach((h,i)=>p.box(-26+i*14,-6,4,10,10,h));},
  diversity(x,y,s){const p=iso(x,y,s);p.box(-32,-32,0,64,64,4);p.box(-24,-6,4,10,10,40);p.wire(-4,-6,20,10,10,22,'d');p.box(-4,-6,4,10,10,16);p.box(16,-6,4,10,10,30);},
  selection(x,y,s){const p=iso(x,y,s);p.box(-32,-32,0,64,64,8);[[-22,-22],[4,-22],[-22,4],[4,4]].forEach(q=>p.box(q[0],q[1],8,16,16,16));},
  gate(x,y,s){const p=iso(x,y,s);p.box(-6,-36,0,12,72,4);p.box(-4,-34,4,8,8,52);p.box(-4,-34,56,8,68,6);p.box(-4,26,4,8,8,52);},
  feed(x,y,s,n,green){const p=iso(x,y,s);p.box(-6,-30,0,12,60,90);if(n===undefined)n=4;
    for(let k=0;k<n;k++){const z=68-k*20;p.poly([[6,-24,z],[6,24,z],[6,24,z+14],[6,-24,z+14]],k===green?'af':'t');}}
};

/* captions */

function setCap(){}

/* ---------- full system ---------- */
const STAGES=[
 ['Candidate sources','Two sources run at the same time. Thunder returns recent posts from accounts you follow. Phoenix retrieval searches everything else for posts that match what you engage with.'],
 ['Hydration','Each candidate is filled in with what ranking needs: the post text, author details and media.'],
 ['Filtering','Duplicates, old posts, your own posts, blocked authors and muted keywords are removed before any model runs.'],
 ['Phoenix scorer','A Grok-based transformer predicts how likely you are to like, reply, repost, click and more, scoring each post on its own.'],
 ['Weighted scorer','The predictions are combined into one score, with a weight for each kind of action.'],
 ['Author diversity','Scores for repeated authors are scaled down so one account cannot take over your feed.'],
 ['Selection','Candidates are sorted by final score and the top K are kept.'],
 ['Visibility filter','A last check removes deleted posts, spam and unsafe content.'],
 ['Feed','What is left is your For You feed, in order.']];
function drawSystem(t){
  const L=14,s=.72,oy=320,ly=314,X=[245,375,505,635,765,895,1015,1120];
  const ph=((t%L)+L)%L,k=Math.min(8,Math.floor(ph/1.5)),w=ph-k*1.5;
  const pa=[[137,226],[170,226],[170,ly],[203,ly]],pb=[[124,381],[170,381],[170,ly],[203,ly]];
  const segs=[];for(let i=0;i<7;i++)segs.push([[X[i]+42,ly],[X[i+1]-(i===6?26:42),ly]]);
  [pa,pb].concat(segs).forEach(q=>SL(q,'d'));
  const N=[3,3,6,4,4,4,4,2,2];
  [pa,pb].concat(segs).forEach((q,i)=>{for(let j=0;j<N[i];j++){const u=(t*.2+j/N[i])%1;const p=along(q,u);cube(p[0],p[1],.5,'t');}});
  const grp=[0,1,1,2,2,2,3,3,4];
  const on=i=>'stg'+(i===k?' on':'');
  G(on(0));OB.thunder(95,235,s);OB.phoenix(95,405,s,t);G(null);
  G(on(1));OB.hydration(X[0],oy,s,t);G(null);
  G(on(2));OB.filtering(X[1],oy,s);G(null);
  G(on(3));OB.scorer(X[2],oy,s,k===3?Math.floor(w/0.25)%4:-1);G(null);
  G(on(4));OB.weighted(X[3],oy,s);G(null);
  G(on(5));OB.diversity(X[4],oy,s);G(null);
  G(on(6));OB.selection(X[5],oy,s);G(null);
  G(on(7));OB.gate(X[6],oy,s);G(null);
  G(on(8));OB.feed(X[7],oy,s,4,1);G(null);
  if(w>.9&&k<8){const route=[pb].concat(segs);const p=along(route[k],ease(seg(w,.9,1.5)));cube(p[0],p[1],.62,'af');}
  const names=[['Hydration','+ post, author, media'],['Filtering','pre-score'],['Phoenix scorer','P(like), P(reply)…'],['Weighted','Σ weight × P'],['Diversity','author decay'],['Selection','top K'],['Visibility','post-selection'],['Feed','ranked for you']];
  names.forEach((n,i)=>{TX(X[i],oy-98,n[0],'lbl');TX(X[i],oy-84,n[1],'sub');if(k===i+1)OUT.push('<rect class="acc" x="'+(X[i]-3.5)+'" y="'+(oy-122)+'" width="7" height="7"/>');});
  TX(95,165,'Thunder','lbl');TX(95,179,'in-network','sub');
  TX(95,452,'Phoenix retrieval','lbl');TX(95,466,'out-of-network','sub');
  if(k===0)OUT.push('<rect class="acc" x="91.5" y="141" width="7" height="7"/>');
  const GR=[[55,135,'SOURCING'],[205,415,'PREPARATION'],[465,805,'SCORING'],[855,1055,'SELECTION'],[1092,1148,'FEED']];
  GR.forEach((r,i)=>{SL([[r[0],494],[r[0],502],[r[1],502],[r[1],494]],grp[k]===i?'n':'g');TX((r[0]+r[1])/2,522,r[2],'cap'+(grp[k]===i?' on':''));});
  setCap('STAGE '+(k+1)+' OF 9',STAGES[k][0],STAGES[k][1]);
}

/* ---------- sourcing ---------- */
function drawSourcing(t){
  const L=8,ph=((t%L)+L)/L%1;
  const tp=iso(260,250,1.4);
  [-21.3,0,21.3].forEach((bx,b)=>{const top=tp.P(bx,0,26);SL([[top[0],96],[top[0],top[1]-4]],'d');
    const u=(t*.45+b*.33)%1;cube(top[0],lerp(96,top[1]-10,ease(u)),.6,'t');});
  TX(260,82,'POST EVENTS STREAM IN','cap');
  OB.thunder(260,250,1.4);
  OB.phoenix(260,470,1.4,t);
  const end=[716,376],pa=[[342,232],[520,232],[520,376],end],pb=[[318,422],[520,422],[520,376],end];
  SL(pa,'d');SL(pb,'d');
  [pa,pb].forEach(q=>{for(let j=0;j<4;j++){const p=along(q,(t*.16+j/4)%1);cube(p[0],p[1],.7,'t');}});
  TX(530,306,'IN PARALLEL','cap','start');
  const g=seg(ph,.3,.55);if(g>0&&g<1){const p=along(pb,ease(g));cube(p[0],p[1],.8,'af');}
  const tr=iso(870,390,2);tr.box(-42,-42,0,84,84,8);

/* ================= v2 · line planes ================= */
const stG=document.getElementById('st'),dyG=document.getElementById('dy');
const XP=(x,y,r,c)=>'<path class="'+c+'" d="M'+R1(x-r)+' '+R1(y)+'H'+R1(x+r)+'M'+R1(x)+' '+R1(y-r)+'V'+R1(y+r)+'"/>';
const DOT=(x,y,r,c,op)=>'<circle class="'+c+'" cx="'+R1(x)+'" cy="'+R1(y)+'" r="'+r+'"'+(op!==undefined?' opacity="'+R1(op*10)/10+'"':'')+'/>';
const TT=(x,y,s,c,a)=>'<text class="'+c+'" x="'+R1(x)+'" y="'+R1(y)+'" text-anchor="'+(a||'middle')+'">'+s+'</text>';
function plane(cx,cy,W,H){const p={cx:cx,cy:cy,W:W,H:H,n:[]};p.P=(u,v)=>[cx+u*0.5,cy-v-u*0.3];return p;}
function grid(p,nu,nv,mu,mv){mu=mu===undefined?.2:mu;mv=mv===undefined?.12:mv;
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const u=nu===1?0:lerp(-p.W/2+p.W*mu,p.W/2-p.W*mu,i/(nu-1)),v=nv===1?0:lerp(p.H/2-p.H*mv,-p.H/2+p.H*mv,j/(nv-1));const q=p.P(u,v);p.n.push({x:q[0],y:q[1],live:true});}
  return p;}
function dots(p,nu,nv){for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const u=lerp(-p.W*.42,p.W*.42,i/(nu-1)),v=lerp(p.H*.44,-p.H*.44,j/(nv-1)),q=p.P(u,v);p.n.push({x:q[0],y:q[1],live:true});}return p;}
function outl(p,c){const k=[[-p.W/2,p.H/2],[p.W/2,p.H/2],[p.W/2,-p.H/2],[-p.W/2,-p.H/2]].map(q=>p.P(q[0],q[1]));return '<path class="'+c+'" d="M'+k.map(q=>R1(q[0])+' '+R1(q[1])).join('L')+'Z"/>';}
function edg(A,B,pick,c){let d='';B.forEach((b,bi)=>{if(!b.live)return;pick(bi,A.length).forEach(ai=>{const a=A[ai];if(!a||!a.live)return;d+='M'+R1(a.x)+' '+R1(a.y)+'L'+R1(b.x)+' '+R1(b.y);});});return d?'<path class="'+c+'" d="'+d+'"/>':'';}
const pN=n=>(bi,len)=>{const r=[];for(let k=0;k<n;k++)r.push((bi*7+k*11+3)%len);return r;};
const pAll=(bi,len)=>Array.from({length:len},(_,i)=>i);
const p1=bi=>[bi];
const crosses=(p,r)=>p.n.map(q=>XP(q.x,q.y,r||4.5,q.live?'x':'xg')).join('');
const dotsOf=p=>p.n.map(q=>DOT(q.x,q.y,.9,'dt')).join('');
function lab(p,s,c,above){const y=above?p.cy-p.H/2-p.W*.15-16:p.cy+p.H/2+p.W*.15+24;return TT(p.cx,y,s,c||'cp');}
function RO(x,y,val,title,rows){let s='<text class="rt" x="'+x+'" y="'+y+'"><tspan class="rg">['+val+']</tspan> '+title+' <tspan class="rg">+</tspan></text>';
  rows.forEach((r,i)=>{s+=TT(x+70,y+24+i*19,r[0],'rk','end')+TT(x+82,y+24+i*19,r[1],r[2]||'rv','start');});return s;}
function pulses(A,B,pick,t,n,speed){let s='';const lb=B.n.map((q,i)=>[q,i]).filter(z=>z[0].live);if(!lb.length)return s;
  for(let j=0;j<n;j++){const bz=lb[(j*5+2)%lb.length],ps=pick(bz[1],A.n.length),a=A.n[ps[j%ps.length]];if(!a||!a.live)continue;
    const u=((t*speed)+j/n)%1;s+=DOT(lerp(a.x,bz[0].x,u),lerp(a.y,bz[0].y,u),1.5,'pu');}return s;}
const poly2=(pts,c)=>'<path class="'+c+'" d="M'+pts.map(q=>R1(q[0])+' '+R1(q[1])).join('L')+'"/>';
const envelope=(PL,c)=>[[-1,1],[-1,-1],[1,1],[1,-1]].map(k=>poly2(PL.map(p=>p.P(k[0]*p.W/2,k[1]*p.H/2)),c)).join('');

function v2System(){
  const cor=dots(plane(95,300,190,300),9,16);

    ca=grid(plane(385,300,150,230),5,7),hy=grid(plane(505,300,150,230),5,7),fi=grid(plane(625,300,150,230),5,7),
    s1=grid(plane(735,300,120,180),4,6),s2=grid(plane(775,300,120,180),4,6),s3=grid(plane(815,300,120,180),4,6),
    se=grid(plane(935,300,100,130),3,4),ck=grid(plane(1035,300,90,110),3,3),fe=grid(plane(1125,300,46,170),1,6);
  [2,6,9,15,19,23,28,31,33].forEach(i=>fi.n[i].live=false);ck.n[4].live=false;
  const PAIRS=[[cor,th,pN(2)],[cor,ph,pN(2)],[th,ca,pN(1)],[ph,ca,pN(1)],[ca,hy,p1],[hy,fi,p1],[fi,s1,pN(3)],[s1,s2,pAll],[s2,s3,pAll],[s3,se,pN(4)],[se,ck,pN(3)],[ck,fe,pN(3)]];
  const PF=(a,b)=>{const z=PAIRS.find(z=>z[0]===a&&z[1]===b);return z?z[2]:pN(2);};
  let S=envelope([ca,fi,s2,se,ck,fe],'fn');
  PAIRS.forEach(z=>S+=edg(z[0].n,z[1].n,z[2],'e'));
  S+=dotsOf(cor)+outl(cor,'pl');
  [th,ph,ca,hy,fi,s1,s2,s3,se,ck,fe].forEach(p=>S+=outl(p,'pl')+crosses(p));
  const LB=[[cor,'ALL POSTS'],[th,'THUNDER',1],[ph,'PHOENIX'],[ca,'CANDIDATES'],[hy,'HYDRATE'],[fi,'FILTER'],[s2,'SCORE'],[se,'SELECT'],[ck,'CHECK'],[fe,'FEED']];
  LB.forEach(l=>S+=lab(l[0],l[1],'cp',l[2]));
  const R=[[cor,70],[ph,9],[ca,17],[hy,17],[fi,17],[s1,13],[s2,10],[s3,14],[se,4],[ck,1],[fe,1]];
  const RP=R.map(r=>[r[0].n[r[1]].x,r[0].n[r[1]].y]);
  const LBI=[0,2,3,4,5,6,6,6,7,8,9];
  const INFO=[['~500M','ALL POSTS',[['WINDOW','per day']]],['OON','PHOENIX',[['SOURCE','out-of-network'],['MATCH','similarity']]],
    ['~1,500','CANDIDATES',[['SOURCES','2'],['FETCH','parallel']]],['+3','HYDRATE',[['POST','text'],['AUTHOR','profile'],['MEDIA','entities']]],
    ['PASS','FILTER',[['DUPES','removed'],['SEEN','removed'],['BLOCKED','removed']]],['0.62','P(LIKE)',[['P(REPLY)','0.18'],['P(REPOST)','0.30'],['P(CLICK)','0.45']]],
    ['0.82','SCORE',[['FORMULA','Σ w × P']]],['×1.0','DIVERSITY',[['AUTHOR','first in feed']]],['#2','SELECT',[['TOP K','100–500']]],
    ['PASS','CHECK',[['SPAM','no'],['DELETED','no']]],['#2','FEED',[['POSITION','2']]]];
  const HOP=1,END=(R.length-1)*HOP,L=END+2.2;
  return {st:S,dyn:t=>{const tt=((t%L)+L)%L,k=Math.min(R.length-2,Math.floor(tt/HOP)),u=tt>=END?1:ease(seg(tt-k*HOP,0,.72)),act=u>=1?k+1:k;
    let s='';const ap=R[act][0];if(ap!==cor)s+=outl(ap,'pl on');
    const lb=LB[LBI[act]];s+=lab(lb[0],lb[1],'cp on',lb[2]);
    if(u<1)s+=pulses(R[k][0],R[k+1][0],PF(R[k][0],R[k+1][0]),t,8,.9);
    const cp=[lerp(RP[k][0],RP[k+1][0],u),lerp(RP[k][1],RP[k+1][1],u)];
    s+=poly2(RP.slice(0,k+1).concat([cp]),'tr')+DOT(cp[0],cp[1],4.5,'gd');
    const inf=INFO[act];return s+RO(990,70,inf[0],inf[1],inf[2]);}};
}

const ELL=(cx,cy,rx,ry,c)=>'<ellipse class="'+c+'" cx="'+R1(cx)+'" cy="'+R1(cy)+'" rx="'+R1(rx)+'" ry="'+R1(ry)+'"/>';
const LN=(x1,y1,x2,y2,c)=>'<path class="'+c+'" d="M'+R1(x1)+' '+R1(y1)+'L'+R1(x2)+' '+R1(y2)+'"/>';
const RC=(x,y,w,h,r,c)=>'<rect class="'+c+'" x="'+R1(x)+'" y="'+R1(y)+'" width="'+R1(w)+'" height="'+R1(h)+'" rx="'+r+'"/>';
const LNS=(pairs,c)=>{let d='';pairs.forEach(p=>d+='M'+R1(p[0].x)+' '+R1(p[0].y)+'L'+R1(p[1].x)+' '+R1(p[1].y));return d?'<path class="'+c+'" d="'+d+'"/>':'';};
const nd=(x,y)=>({x:x,y:y,live:true});
const qb=(a,c,b,u)=>[(1-u)*(1-u)*a[0]+2*(1-u)*u*c[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*c[1]+u*u*b[1]];

  return {st:ELL(cx,cy,r,r,'pl')+ELL(cx,cy,r,r*.31,'pl'),
    at:t=>{const a=t*.15,b=.32,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
      return P.map(p=>{const X=p[0]*ca+p[2]*sa,Z=-p[0]*sa+p[2]*ca;return {x:cx+r*X,y:cy-r*(p[1]*cb+Z*sb),f:Z*cb-p[1]*sb};});}};}
const sphDots=pts=>pts.map(q=>DOT(q.x,q.y,q.f>0?1.2:.9,q.f>0?'tg':'dt')).join('');

function towers(cx,cy){let s='';const o=nd(cx+44,cy),cn=[];
  [-14,14].forEach(dx=>{s+=LN(cx+dx,cy-24,cx+dx,cy+24,'pl');for(let k=0;k<4;k++){const q=nd(cx+dx,cy-24+k*16);cn.push(q);s+=XP(q.x,q.y,3.5,'x');}});

const hcol=(cx,cy,k,span)=>Array.from({length:k},(_,i)=>nd(cx,k===1?cy:cy-span/2+span*i/(k-1)));

  for(let i=0;i<=nu;i++){const u=-hu+i*2*hu/nu,a=P(u,-hv),b=P(u,hv);s+=LN(a[0],a[1],b[0],b[1],'pl');}

    for(let i=0;i<5;i++)s+='<circle class="'+(i===ci?'tg':'dt')+'" cx="'+R1(vx+w-24/z)+'" cy="'+R1(vy+(230+i*30)/z)+'" r="'+R1((i===ci?3:2)/z)+'"/>';
    if(P<.04)s+='<text class="cp" x="'+R1(vx+w/2)+'" y="'+R1(vy+h-28/z)+'" text-anchor="middle" style="font-size:'+fz+'px" opacity="'+(1-P/.04).toFixed(2)+'">SCROLL TO LOOK INSIDE</text>';
    if(s!==lastHud){E.ov.innerHTML=s;lastHud=s;}
    return '';}};
}
/* ================= versions + engine ================= */
const VERS=[['v26','v26']];
const V={v26:{system:v26Story},v25:{system:v25Story},v24:{system:v24Story},v23:{system:v23Story},v22:{system:v22Story},v21:{system:v21Story},v20:{system:v20Story},v19:{system:v19Story},v18:{system:v18Story},v17:{system:v17Story},v16:{system:v16Story},v15:{system:v15Story},v14:{system:v14Story},v13:{system:v13Story},v12:{system:v12System,sourcing:v7Sourcing,ranking:v10Scoring,selection:v11Select},v11:{system:v4System,sourcing:v7Sourcing,ranking:v10Scoring,selection:v11Select},v10:{system:v4System,sourcing:v7Sourcing,ranking:v10Scoring,selection:v3Select},v9:{system:v4System,sourcing:v7Sourcing,ranking:v9Scoring,selection:v3Select},v8:{system:v4System,sourcing:v7Sourcing,ranking:v8Scoring,selection:v3Select},v7:{system:v4System,sourcing:v7Sourcing,prep:v3Prep,ranking:v3Scoring,selection:v3Select},v6:{system:v4System,sourcing:v6Sourcing,prep:v3Prep,ranking:v3Scoring,selection:v3Select},v5:{system:v4System,sourcing:v5Sourcing,prep:v3Prep,ranking:v3Scoring,selection:v3Select},v4:{system:v4System,sourcing:v3Sourcing,prep:v3Prep,ranking:v3Scoring,selection:v3Select},v3:{system:v3System,sourcing:v3Sourcing,prep:v3Prep,ranking:v3Scoring,selection:v3Select,funnel:v3Funnel},v2:{system:v2System,sourcing:v2Sourcing,prep:v2Prep,ranking:v2Scoring,selection:v2Select,funnel:v2Funnel},
         v1:{system:drawSystem,sourcing:drawSourcing,prep:drawPrep,ranking:drawRanking,selection:drawSelection,funnel:drawFunnel}};
const sel=document.getElementById('ver');
sel.innerHTML=VERS.map((v,i)=>'<option value="'+v[0]+'">'+v[1]+(i===0?' (latest)':'')+'</option>').join('');
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let ver='v26',cur='system',built=null,paused=reduce,start=performance.now(),pt=3.3,last=0;
const playBtn=document.getElementById('play');
const spacer=document.getElementById('spacer'),stageEl=document.querySelector('.stage');let SPc=0;
function scrollP(){if(!spacer||spacer.hidden)return 0;const top=spacer.getBoundingClientRect().top+window.scrollY-stageEl.offsetHeight;return clamp((window.scrollY-top)/Math.max(1,spacer.offsetHeight));}
function render(tt){if(ver==='v13'||ver==='v14'||ver==='v15'||ver==='v16'||ver==='v17'||ver==='v18'||ver==='v19'||ver==='v20'||ver==='v21'||ver==='v22'||ver==='v23'||ver==='v24'||ver==='v25'||ver==='v26'){const o=built.dyn(tt,SPc);if(o||dyG.firstChild)dyG.innerHTML=o;return;}if(ver==='v1'){OUT=[];V.v1[cur](tt);dyG.innerHTML=OUT.join('');}else dyG.innerHTML=built.dyn(tt);}
function syncBtn(){playBtn.textContent=paused?'Play':'Pause';playBtn.setAttribute('aria-pressed',String(paused));}
function parse(h){const m=/^(v\d+)-([a-z]+)$/.exec(h||'');if(m&&V[m[1]])return [m[1],V[m[1]][m[2]]?m[2]:'system'];return [VERS[0][0],(V[VERS[0][0]][h]?h:'system')];}
function show(){const p=parse(location.hash.slice(1));ver=p[0];cur=p[1];sel.value=ver;
  document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.v===cur));b.hidden=!V[ver][b.dataset.v];});
  const CAMV=['v15','v16','v17','v18','v19','v20','v21','v22','v23','v24','v25','v26'].indexOf(ver)>=0;const sc3=ver==='v13'||ver==='v14'||CAMV;svg.classList.toggle('cam',CAMV);if(!CAMV){svg.setAttribute('viewBox','0 0 1200 560');svg.style.transform='';}document.body.classList.toggle('scrolly',sc3);if(spacer)spacer.hidden=!sc3;svg.style.display=ver==='v14'?'none':'';document.getElementById('gl').hidden=ver!=='v14';if(ver==='v1'){built=null;stG.innerHTML='';}else{built=V[ver][cur]();stG.innerHTML=built.st;}
  start=performance.now();pt=paused?3.3:0;render(pt);}
function go(v,view){const h=v+'-'+view;if(location.hash.slice(1)!==h)location.hash=h;else show();}
function loop(now){if(ver==='v13'||ver==='v14'||ver==='v15'||ver==='v16'||ver==='v17'||ver==='v18'||ver==='v19'||ver==='v20'||ver==='v21'||ver==='v22'||ver==='v23'||ver==='v24'||ver==='v25'||ver==='v26'){if(now-last>16){last=now;const tg=scrollP();SPc+=(tg-SPc)*(ver==='v16'||ver==='v17'||ver==='v18'||ver==='v19'||ver==='v20'||ver==='v21'?.07:(ver==='v22'||ver==='v23'||ver==='v24'||ver==='v25'||ver==='v26')?.16:.14);if(Math.abs(tg-SPc)<.0005)SPc=tg;render(reduce?0:(now-start)/1000);}}else if(!paused&&now-last>33){last=now;pt=(now-start)/1000;render(pt);}requestAnimationFrame(loop);}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(ver,b.dataset.v);});
sel.addEventListener('change',()=>go(sel.value,cur));
window.addEventListener('hashchange',show);
playBtn.addEventListener('click',()=>{paused=!paused;if(!paused)start=performance.now()-pt*1000;syncBtn();});
document.getElementById('restart').addEventListener('click',()=>{start=performance.now();pt=0;render(0);});
syncBtn();show();requestAnimationFrame(loop);
})();
