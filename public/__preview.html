<!doctype html><meta charset=utf-8><body style="margin:0;background:#F5F5F5;font-family:sans-serif">
<div style="display:grid;grid-template-columns:repeat(4,200px);gap:30px;padding:30px">
<script>
const L=[['triplewhale',1030/150],['enterpret',5],['lindy',3],['freehand',164/35],['anything',1165/305],['superblocks',137/26],['fishaudio-mark',1],['cartesia',579/83]];
for(const [n,r] of L){const k=Math.sqrt(1300/r);document.write(`<div style="height:60px;display:flex;align-items:center;justify-content:center;outline:1px dashed #ccc"><span style="display:block;width:${r*k}px;height:${k}px;background:#989898;-webkit-mask:url(/assets/clients/${n}.svg) center/contain no-repeat;mask:url(/assets/clients/${n}.svg) center/contain no-repeat"></span></div>`)}
</script></div>
